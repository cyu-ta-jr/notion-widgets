<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Life Progress Widget</title>
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com" rel="stylesheet">
  <style>
    :root {
      --bg: #191919;
      --bg2: #202020;
      --bg3: #2a2a2a;
      --line: #2f2f2f;
      --tx: #ffffff;
      --tx2: #ffffff;
      --tx3: #ffffff;
      --accent: #2f6fde;
    }

    html, body {
      background-color: #191919 !important;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: "Zen Kaku Gothic New", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card {
      background-color: var(--bg);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 20px 22px 22px;
      width: calc(100% - 2px);
      height: calc(100% - 2px);
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 12px;
    }

    .label {
      font-size: 12px;
      color: #ffffff !important;
      font-weight: 500;
      margin-bottom: 6px;
    }

    .main-num {
      font-family: 'JetBrains Mono', monospace;
      font-size: 48px;
      font-weight: 500;
      letter-spacing: -0.03em;
      line-height: 1;
      color: #ffffff !important;
    }
    .main-num span { font-size: 18px; }

    .stats-container {
      display: flex;
      gap: 18px;
      text-align: right;
      margin-bottom: 4px;
    }
    .stat-box { display: flex; flex-direction: column; }
    .stat-val {
      font-family: 'JetBrains Mono', monospace;
      font-size: 16px;
      font-weight: 500;
      color: #ffffff !important;
    }
    .stat-lbl {
      font-size: 11px;
      color: #ffffff !important;
      margin-top: 2px;
      opacity: 0.8;
    }

    .progress-bar-container {
      height: 6px;
      background-color: var(--bg3);
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 18px;
      margin-top: 10px;
    }
    .progress-bar-fill {
      height: 100%;
      background-color: #ffffff;
      border-radius: 3px;
      width: 0%;
      transition: width 0.5s ease;
    }

    .content-area {
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      min-height: 0; 
    }

    .grid {
      display: grid;
      /* 90歳（540ヶ月）を1行60ドット（5年分）×9行で綺麗に収める配置 */
      grid-template-columns: repeat(60, 1fr);
      gap: 1.5px;
    }

    .dot {
      aspect-ratio: 1;
      border-radius: 50%;
      background-color: var(--bg3);
    }
    .dot.passed { background-color: rgba(155, 154, 151, 0.45); }
    .dot.today {
      background-color: var(--accent);
      position: relative;
      box-shadow: 0 0 0 2px rgba(47, 111, 222, 0.4);
    }

    .footer {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: #ffffff !important;
      margin-top: 6px;
    }

    #pct {
      font-size: 20px;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="header">
      <div>
        <div class="label" id="year-title">生涯消化日数 (90迄)</div>
        <div class="main-num" id="pct">0.0<span>%</span></div>
      </div>
      <div class="stats-container">
        <div class="stat-box"><div class="stat-val" id="age">0</div><div class="stat-lbl">年齢</div></div>
        <div class="stat-box"><div class="stat-val" id="passed-days">0</div><div class="stat-lbl">生きた日</div></div>
        <div class="stat-box"><div class="stat-val" id="remaining-days">0</div><div class="stat-lbl">残り日</div></div>
      </div>
    </div>
    <div class="progress-bar-container">
      <div class="progress-bar-fill" id="bar"></div>
    </div>
    
    <div class="content-area">
      <div class="grid" id="grid"></div>
      <div class="footer">
        <div>0 歳</div>
        <div>1 ドット = 2 ヶ月</div>
        <div>90 歳</div>
      </div>
    </div>
  </div>

  <script>
    // ==========================================
    // 【設定】ここにあなたの生年月日を入力してください
    // ==========================================
    const BIRTH_DATE = "1980-12-14"; 

    function calculateLife() {
      const today = new Date();
      const birth = new Date(BIRTH_DATE);
      
      // 90歳の誕生日を計算
      const targetAge = 90;
      const ninetyYearsOld = new Date(birth.getFullYear() + targetAge, birth.getMonth(), birth.getDate());

      // 各種日数の計算 (1日 = 86,400,000ミリ秒)
      const passedMs = today - birth;
      const passedDays = Math.floor(passedMs / 86400000);
      const totalMs = ninetyYearsOld - birth;
      const totalDays = Math.floor(totalMs / 86400000);
      const remainingDays = Math.max(0, totalDays - passedDays);
      
      // 進捗率の計算
      const lifePct = Math.min(100, Math.max(0, (passedDays / totalDays) * 100)).toFixed(1);

      // 満年齢の計算
      let age = today.getFullYear() - birth.getFullYear();
      const m = today.getMonth() - birth.getMonth();
      if (m < 0 || (m === 0 && today.getDate() < birth.getDate())) {
        age--;
      }

      // 画面への反映（カンマ区切りフォーマット）
      document.getElementById('pct').innerHTML = `${lifePct}<span>%</span>`;
      document.getElementById('age').innerText = age;
      document.getElementById('passed-days').innerText = passedDays.toLocaleString();
      document.getElementById('remaining-days').innerText = remainingDays.toLocaleString();
      document.getElementById('bar').style.width = `${lifePct}%`;

      // ドット数の計算（90歳まで 1ドット=2ヶ月 なので合計 90 * 6 = 540 ドット）
      const totalDots = targetAge * 6; 
      
      // 生まれてから何ヶ月経ったかをベースに経過ドット数を計算
      const passedMonths = (today.getFullYear() - birth.getFullYear()) * 12 + (today.getMonth() - birth.getMonth());
      const passedDots = Math.min(totalDots, Math.max(0, Math.floor(passedMonths / 2)));

      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      
      for (let i = 1; i <= totalDots; i++) {
        const dot = document.createElement('div');
        dot.className = 'dot';
        if (i < passedDots) {
          dot.classList.add('passed');
        } else if (i === passedDots) {
          dot.classList.add('today');
        }
        grid.appendChild(dot);
      }
    }

    calculateLife();
  </script>
</body>
</html>
