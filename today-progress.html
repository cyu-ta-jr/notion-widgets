<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Today</title>
<link rel="preconnect" href="https://googleapis.com">
<link rel="preconnect" href="https://gstatic.com" crossorigin>
<link href="https://googleapis.com" rel="stylesheet">
<style>
  /* ===== Tokens (life-progress.txt と共通化) ===== */
  :root {
    --bg: #191919;
    --bg2: #202020;
    --bg3: #2a2a2a;
    --line: #2f2f2f;
    --tx: #ffffff;
    --tx2: #ffffff;
    --tx3: #ffffff;
    --accent: #2f6fde;
    --font: "Zen Kaku Gothic New", "Hiragino Sans", sans-serif;
    --mono: "JetBrains Mono", ui-monospace, monospace;
    --sun: #ff7369; 
    --sat: #6aa3f5;
  }

  html, body {
    background-color: #191919 !important;
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }
  body {
    font-family: var(--font);
    display: flex;
    justify-content: center;
    align-items: center;
    -webkit-font-smoothing: antialiased;
  }

  /* ===== Card ===== */
  .card {
    background-color: var(--bg);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 20px 22px 22px;
    width: calc(100% - 2px);
    height: calc(100% - 2px);
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
  }

  /* ===== Header (日付大きく表示するメインエリア) ===== */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    margin-bottom: 12px;
  }

  .left-block {
    display: flex;
    flex-direction: column;
  }

  /* 2026年の消化日数のフォントカラーを完全な白色に修正 */
  .label {
    font-size: 12px;
    color: #ffffff !important;
    font-weight: 500;
    margin-bottom: 6px;
  }

  /* 大きな日付表示のスタイル */
  .date {
    display: flex;
    align-items: baseline;
    line-height: 1;
    white-space: nowrap;
  }
  .date .md {
    font-family: var(--mono);
    font-weight: 500;
    font-size: 48px; /* life-progress の数字サイズに統一 */
    letter-spacing: -0.03em;
    color: #ffffff !important;
  }
  .date .md .sep {
    color: rgba(255, 255, 255, 0.4);
    font-weight: 400;
    margin: 0 0.02em;
  }
  .date .wd {
    font-size: 18px;
    font-weight: 700;
    margin-left: 10px;
  }
  .date .wd.sun { color: var(--sun); } 
  .date .wd.sat { color: var(--sat); }

  /* 右側カウンターエリア */
  .stats-container {
    display: flex;
    gap: 18px;
    text-align: right;
    margin-bottom: 4px;
  }
  .stat-box { display: flex; flex-direction: column; }
  .stat-val {
    font-family: var(--mono);
    font-size: 16px;
    font-weight: 500;
    color: #ffffff !important;
  }
  .stat-lbl {
    font-size: 11px;
    color: #ffffff !important;
    margin-top: 2px;
    opacity: 0.8;
    white-space: nowrap;
  }

  /* ===== Progress Bar ===== */
  .progress-bar-container {
    height: 6px;
    background-color: var(--bg3);
    border-radius: 3px;
    overflow: hidden;
    margin-bottom: 18px;
    margin-top: 10px;
  }
  .progress-bar-fill {
    height: 100%;
    background-color: #ffffff;
    border-radius: 3px;
    width: 0%;
    transition: width 0.5s ease;
  }

  /* ===== Content Area ===== */
  .content-area {
    display: flex;
    flex-direction: column;
    flex-grow: 1;
    min-height: 0;
  }

  /* life-progress に完全に合わせた横60列グリッド */
  .grid {
    display: grid;
    grid-template-columns: repeat(60, 1fr);
    gap: 1.5px; /* 隙間を少し狭めてドット自体を大きめに変更 */
  }
  .dot {
    width: 100%;
    aspect-ratio: 1 / 1; /* 正方形を維持 */
    /* border-radius: 50%; を削除して四角形に変更 */
    background-color: var(--bg3);
  }
  .dot.passed { background-color: rgba(155, 154, 151, 0.45); }
  .dot.today {
    background-color: var(--accent);
    position: relative;
    box-shadow: 0 0 0 2px rgba(47, 111, 222, 0.4);
  }

  /* ===== Footer ===== */
  .footer {
    display: flex;
    justify-content: space-between;
    align-items: flex-end; /* 進捗率が大きくなった際の縦方向の位置揃え */
    font-family: var(--mono);
    font-size: 10px;
    color: #ffffff !important;
    margin-top: 6px; /* ドット絵との間の余白を詰める調整 */
  }

  /* 進捗率のフォントサイズを2倍に */
  #pct {
    font-size: 20px;
  }
</style>
</head>
<body>

  <div class="card">
    <div class="header">
      <div class="left-block">
        <div class="label" id="title-lbl">2026 年の消化日数</div>
        <div class="date">
          <span class="md"><span id="m">10</span><span class="sep">/</span><span id="d">24</span></span>
          <span class="wd" id="wd">(土)</span>
        </div>
      </div>
      <div class="stats-container">
        <div class="stat-box"><div class="stat-val" id="doy">0</div><div class="stat-lbl">経過日</div></div>
        <div class="stat-box"><div class="stat-val" id="wk">0</div><div class="stat-lbl">残り週</div></div>
        <div class="stat-box"><div class="stat-val" id="left">0</div><div class="stat-lbl">残り日</div></div>
      </div>
    </div>
    
    <div class="progress-bar-container">
      <div class="progress-bar-fill" id="bar"></div>
    </div>
    
    <div class="content-area">
      <div class="grid" id="dots"></div>
      <div class="footer">
        <div id="y0">JAN 01</div>
        <div id="pct">0.0%</div>
        <div>DEC 31</div>
      </div>
    </div>
  </div>

<script>
(function(){
  const TZ = "Asia/Tokyo";
  // 曜日表記をカッコ形式に修正
  const WD = ["(日)","(月)","(火)","(水)","(木)","(金)","(土)"];
  const $ = id => document.getElementById(id);

  function parts(now){
    const f = new Intl.DateTimeFormat("en-US", {
      timeZone: TZ, year:"numeric", month:"numeric", day:"numeric"
    });
    const o = {};
    f.formatToParts(now).forEach(p => o[p.type] = p.value);
    const y = +o.year, m = +o.month, d = +o.day;
    const w = new Date(Date.UTC(y, m - 1, d)).getUTCDay();
    return { y, m, d, w };
  }

  function isoWeek(y, m, d){
    const t = new Date(Date.UTC(y, m - 1, d));
    const day = t.getUTCDay() || 7;
    t.setUTCDate(t.getUTCDate() + 4 - day);
    const y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
    return Math.ceil(((t - y0) / 864e5 + 1) / 7);
  }

  function render(){
    const p = parts(new Date());
    const total = (p.y % 4 === 0 && p.y % 100 !== 0) || p.y % 400 === 0 ? 366 : 365;
    const doy = Math.round((Date.UTC(p.y, p.m - 1, p.d) - Date.UTC(p.y, 0, 1)) / 864e5) + 1;
    const pct = (doy / total) * 100;
    
    const totalWeeks = isoWeek(p.y, 12, 31);
    const currentWeek = isoWeek(p.y, p.m, p.d);

    $("title-lbl").textContent = `${p.y} 年の消化日数`;
    $("m").textContent = String(p.m).padStart(2, "0");
    $("d").textContent = String(p.d).padStart(2, "0");
    
    const wd = $("wd");
    wd.textContent = WD[p.w];
    wd.className = "wd" + (p.w === 0 ? " sun" : p.w === 6 ? " sat" : "");

    $("doy").textContent = doy;
    $("wk").textContent = Math.max(0, totalWeeks - currentWeek);
    $("left").textContent = total - doy;
    $("bar").style.width = pct.toFixed(1) + "%";
    
    $("y0").textContent = "JAN 01 · " + p.y;
    $("pct").textContent = pct.toFixed(1) + "%";

    const dotsContainer = $("dots");
    if (dotsContainer.childElementCount !== total || dotsContainer.dataset.doy != doy) {
      dotsContainer.innerHTML = "";
      const fragment = document.createDocumentFragment();
      for (let i = 1; i <= total; i++) {
        const dot = document.createElement("div");
        dot.className = "dot";
        if (i < doy) {
          dot.classList.add("passed");
        } else if (i === doy) {
          dot.classList.add("today");
        }
        fragment.appendChild(dot);
      }
      dotsContainer.appendChild(fragment);
      dotsContainer.dataset.doy = doy;
    }
  }

  render();
  const tick = () => { render(); setTimeout(tick, 60000 - (Date.now() % 60000) + 50); };
  setTimeout(tick, 60000 - (Date.now() % 60000) + 50);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) render(); });
})();
</script>
</body>
</html>
