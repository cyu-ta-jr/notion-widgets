<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Year Progress Widget</title>
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com" rel="stylesheet">
  <style>
    :root {
      --bg: #191919;
      --bg2: #202020;
      --bg3: #2a2a2a;
      --line: #2f2f2f;
      --tx: #ffffff;
      --tx2: #ffffff;
      --tx3: #ffffff;
      --accent: #2f6fde;
      --sun: #ff7369; 
      --sat: #6aa3f5;
    }

    html, body {
      background-color: #191919 !important;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: "Zen Kaku Gothic New", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card {
      background-color: var(--bg);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 20px 22px 22px;
      width: calc(100% - 2px);
      height: calc(100% - 2px);
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 12px;
    }

    /* タイトルのカラーを100%の白色に修正 */
    .label {
      font-size: 12px;
      color: #ffffff !important;
      font-weight: 500;
      margin-bottom: 6px;
      opacity: 1.0 !important;
    }

    /* 日付と曜日を横並びにするスタイル */
    .date-container {
      display: flex;
      align-items: baseline;
    }

    .main-num {
      font-family: 'JetBrains Mono', monospace;
      font-size: 48px;
      font-weight: 500;
      letter-spacing: -0.03em;
      line-height: 1;
      color: #ffffff !important;
    }

    /* 曜日のスタイル設定 */
    .wd {
      font-size: 18px;
      font-weight: 700;
      margin-left: 8px;
      font-family: "Zen Kaku Gothic New", sans-serif;
    }
    .wd.sun { color: var(--sun); } 
    .wd.sat { color: var(--sat); }

    .stats-container {
      display: flex;
      gap: 18px;
      text-align: right;
      margin-bottom: 4px;
    }
    .stat-box { display: flex; flex-direction: column; }
    .stat-val {
      font-family: 'JetBrains Mono', monospace;
      font-size: 16px;
      font-weight: 500;
      color: #ffffff !important;
    }
    .stat-lbl {
      font-size: 11px;
      color: #ffffff !important;
      margin-top: 2px;
      opacity: 0.8;
    }

    .progress-bar-container {
      height: 6px;
      background-color: var(--bg3);
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 18px;
      margin-top: 10px;
    }
    .progress-bar-fill {
      height: 100%;
      background-color: #ffffff;
      border-radius: 3px;
      width: 0%;
      transition: width 0.5s ease;
    }

    .content-area {
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      min-height: 0; 
    }

    /* 横60列の四角グリッドに変更 */
    .grid {
      display: grid;
      grid-template-columns: repeat(60, 1fr);
      gap: 1.5px;
    }

    /* ドットを四角形に変更 */
    .dot {
      aspect-ratio: 1;
      background-color: var(--bg3);
    }
    .dot.passed { background-color: rgba(155, 154, 151, 0.45); }
    .dot.today {
      background-color: var(--accent);
      position: relative;
      box-shadow: 0 0 0 2px rgba(47, 111, 222, 0.4);
    }

    .footer {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: #ffffff !important;
      margin-top: 6px; /* ドットとの隙間を詰める */
    }

    /* 最終行の進捗率フォントサイズを2倍に */
    #pct {
      font-size: 20px;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="header">
      <div>
        <div class="label" id="year-title">2026 年の消化日数</div>
        <div class="date-container">
          <div class="main-num" id="date-display">10/24</div>
          <!-- 曜日を括弧表記で出力する要素 -->
          <div class="wd" id="wd-display">(土)</div>
        </div>
      </div>
      <div class="stats-container">
        <div class="stat-box"><div class="stat-val" id="passed-days">0</div><div class="stat-lbl">経過日</div></div>
        <div class="stat-box"><div class="stat-val" id="remaining-weeks">0</div><div class="stat-lbl">残り週</div></div>
        <div class="stat-box"><div class="stat-val" id="remaining-days">0</div><div class="stat-lbl">残り日</div></div>
      </div>
    </div>
    <div class="progress-bar-container">
      <div class="progress-bar-fill" id="bar"></div>
    </div>
    
    <div class="content-area">
      <div class="grid" id="grid"></div>
      <div class="footer">
        <div>JAN 01</div>
        <div id="pct">0.0%</div>
        <div>DEC 31</div>
      </div>
    </div>
  </div>

  <script>
    function calculateYear() {
      const TZ = "Asia/Tokyo";
      const WD = ["(日)", "(月)", "(火)", "(水)", "(木)", "(金)", "(土)"];
      
      const today = new Date();
      
      // 日本標準時に合わせた日付情報の取得
      const formatter = new Intl.DateTimeFormat("en-US", {
        timeZone: TZ, year: "numeric", month: "numeric", day: "numeric"
      });
      const parts = {};
      formatter.formatToParts(today).forEach(p => parts[p.type] = p.value);
      
      const year = +parts.year;
      const month = +parts.month;
      const day = +parts.day;
      
      // 曜日インデックスの取得
      const wIndex = new Date(Date.UTC(year, month - 1, day)).getUTCDay();

      document.getElementById('year-title').innerText = `${year} 年の消化日数`;
      
      // 日付の `MM/DD` 形式表示
      const mm = String(month).padStart(2, '0');
      const dd = String(day).padStart(2, '0');
      document.getElementById('date-display').innerText = `${mm}/${dd}`;
      
      // 曜日の表示変更とクラス適用
      const wdEl = document.getElementById('wd-display');
      wdEl.innerText = WD[wIndex];
      wdEl.className = "wd" + (wIndex === 0 ? " sun" : wIndex === 6 ? " sat" : "");

      // 各種日数の計算
      const startOfYear = new Date(Date.UTC(year, 0, 1));
      const currentUTC = new Date(Date.UTC(year, month - 1, day));
      const passedDays = Math.round((currentUTC - startOfYear) / 86400000) + 1;
      const totalDays = (year % 4 === 0 && year % 100 !== 0) || year % 400 === 0 ? 366 : 365;
      const remainingDays = totalDays - passedDays;
      
      // 週数の計算ロジック
      function isoWeek(y, m, d) {
        const t = new Date(Date.UTC(y, m - 1, d));
        const dayNum = t.getUTCDay() || 7;
        t.setUTCDate(t.getUTCDate() + 4 - dayNum);
        const y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
        return Math.ceil(((t - y0) / 864e5 + 1) / 7);
      }
      const totalWeeks = isoWeek(year, 12, 31);
      const currentWeek = isoWeek(year, month, day);
      const remainingWeeks = Math.max(0, totalWeeks - currentWeek);

      const yearPct = ((passedDays / totalDays) * 100).toFixed(1);

      // 各要素へのデータ反映
      document.getElementById('pct').innerText = `${yearPct}%`;
      document.getElementById('passed-days').innerText = passedDays;
      document.getElementById('remaining-days').innerText = remainingDays;
      document.getElementById('remaining-weeks').innerText = remainingWeeks;
      document.getElementById('bar').style.width = `${yearPct}%`;

      // グリッドドット（四角）の生成
      const yearGrid = document.getElementById('grid');
      yearGrid.innerHTML = '';
      for (let i = 1; i <= totalDays; i++) {
        const dot = document.createElement('div');
        dot.className = 'dot';
        if (i < passedDays) dot.classList.add('passed');
        else if (i === passedDays) dot.classList.add('today');
        yearGrid.appendChild(dot);
      }
    }
    
    calculateYear();
    // 1分ごとに更新をかける処理
    const tick = () => { calculateYear(); setTimeout(tick, 60000 - (Date.now() % 60000) + 50); };
    setTimeout(tick, 60000 - (Date.now() % 60000) + 50);
    document.addEventListener("visibilitychange", () => { if (!document.hidden) calculateYear(); });
  </script>
</body>
</html>
