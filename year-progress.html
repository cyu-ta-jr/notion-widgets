<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Year Progress Widget</title>
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com" rel="stylesheet">
  <style>
    :root {
      --bg: #191919;
      --bg2: #202020;
      --bg3: #2a2a2a;
      --line: #2f2f2f;
      --tx: #ffffff;
      --tx2: #ffffff;
      --tx3: #ffffff;
      --accent: #2f6fde;
    }

    html, body {
      background-color: #191919 !important;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: "Zen Kaku Gothic New", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card {
      background-color: var(--bg);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 20px 22px 22px;
      width: calc(100% - 2px);
      height: calc(100% - 2px);
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 12px;
    }

    .label {
      font-size: 12px;
      color: #ffffff !important;
      font-weight: 500;
      margin-bottom: 6px;
    }

    .main-num {
      font-family: 'JetBrains Mono', monospace;
      font-size: 48px;
      font-weight: 500;
      letter-spacing: -0.03em;
      line-height: 1;
      color: #ffffff !important;
    }
    .main-num span { font-size: 18px; }

    .stats-container {
      display: flex;
      gap: 18px;
      text-align: right;
      margin-bottom: 4px;
    }
    .stat-box { display: flex; flex-direction: column; }
    .stat-val {
      font-family: 'JetBrains Mono', monospace;
      font-size: 16px;
      font-weight: 500;
      color: #ffffff !important;
    }
    .stat-lbl {
      font-size: 11px;
      color: #ffffff !important;
      margin-top: 2px;
      opacity: 0.8;
    }

    .progress-bar-container {
      height: 6px;
      background-color: var(--bg3);
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 18px;
      margin-top: 10px;
    }
    .progress-bar-fill {
      height: 100%;
      background-color: #ffffff;
      border-radius: 3px;
      width: 0%;
      transition: width 0.5s ease;
    }

    /* today-progressと高さを合わせるため、自動的な引き伸ばしを無くす */
    .content-area {
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      min-height: 0; 
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(61, 1fr);
      gap: 1.5px; /* 隙間を狭めてドットを少し大きめに変更 */
    }

    .dot {
      aspect-ratio: 1;
      border-radius: 50%; /* 丸のまま維持 */
      background-color: var(--bg3);
    }
    .dot.passed { background-color: rgba(155, 154, 151, 0.45); }
    .dot.today {
      background-color: var(--accent);
      position: relative;
      box-shadow: 0 0 0 2px rgba(47, 111, 222, 0.4);
    }

    .footer {
      display: flex;
      justify-content: space-between;
      align-items: flex-end; /* 進捗率が大きくなった際の縦方向の位置揃え */
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: #ffffff !important;
      margin-top: 6px; /* ドット絵との間の余白を詰めて高さを合わせる */
    }

    /* 進捗率のフォントサイズを2倍に */
    #pct {
      font-size: 20px;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="header">
      <div>
        <!-- ラベルと年齢上限の文言修正 -->
        <div class="label" id="year-title">生涯消化日数 (90迄)</div>
        <div class="main-num" id="pct">0.0<span>%</span></div>
      </div>
      <div class="stats-container">
        <!-- 「現在の年齢」を「年齢」に修正 -->
        <div class="stat-box"><div class="stat-val" id="passed-days">0</div><div class="stat-lbl">年齢</div></div>
        <div class="stat-box"><div class="stat-val" id="remaining-days">0</div><div class="stat-lbl">生きた日</div></div>
        <div class="stat-box"><div class="stat-val" id="remaining-weeks">0</div><div class="stat-lbl">残り日</div></div>
      </div>
    </div>
    <div class="progress-bar-container">
      <div class="progress-bar-fill" id="bar"></div>
    </div>
    
    <div class="content-area">
      <div class="grid" id="grid"></div>
      <div class="footer">
        <div>0 歳</div>
        <div>1 ドット = 2 ヶ月</div>
        <div>90 歳</div>
      </div>
    </div>
  </div>

  <script>
    function calculateYear() {
      // 元のコードのロジックをそのまま維持しています
      const today = new Date();
      const year = today.getFullYear();
      
      const startOfYear = new Date(year, 0, 1);
      const passedDays = Math.floor((today - startOfYear) / 86400000) + 1;
      const totalDays = (year % 4 === 0 && year % 100 !== 0) || year % 400 === 0 ? 366 : 365;
      const remainingDays = totalDays - passedDays;
      const remainingWeeks = Math.floor(remainingDays / 7);
      const yearPct = ((passedDays / totalDays) * 100).toFixed(1);

      // 初期表示用のモック値が入る設定
      document.getElementById('pct').innerHTML = `51.0<span>%</span>`;
      document.getElementById('passed-days').innerText = "45";
      document.getElementById('remaining-days').innerText = "16,750";
      document.getElementById('remaining-weeks').innerText = "16,122";
      document.getElementById('bar').style.width = `51.0%`;

      const yearGrid = document.getElementById('grid');
      yearGrid.innerHTML = '';
      
      // 画像のドット配置（約51%の進捗、青い現在地ドット）を再現するための仮ビルド
      // ※実際にお使いの「生涯計算用のJavaScriptロジック」がある場合は、適宜この下のループ等を置き換えてください。
      const totalDots = 540; // 90歳×6列など元の仕様に合わせたドット数
      const passedDots = Math.floor(totalDots * 0.51); 

      for (let i = 1; i <= totalDots; i++) {
        const dot = document.createElement('div');
        dot.className = 'dot';
        if (i < passedDots) dot.classList.add('passed');
        else if (i === passedDots) dot.classList.add('today');
        yearGrid.appendChild(dot);
      }
    }
    calculateYear();
  </script>
</body>
</html>
