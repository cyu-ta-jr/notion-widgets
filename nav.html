<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notion Navigation Widget</title>
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #191919;
      --bg2: #202020;
      --bg3: #2a2a2a;
      --line: #2f2f2f;
      --tx: #e6e5e3;
      --tx3: #6b6a67;
    }

    html {
      background-color: #191919 !important;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      background-color: #191919 !important;
      font-family: "Zen Kaku Gothic New", sans-serif;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .nav-container {
      width: calc(100% - 2px);
      background-color: var(--bg2);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 6px;
      box-sizing: border-box;
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 6px;
    }

    /* 📌 【修正点】デザインを維持したまま、リンク要素(<a>)として機能するように調整 */
    .nav-item {
      display: flex;
      flex-direction: column;
      padding: 10px 12px;
      border-radius: 7px;
      text-decoration: none; /* 下線を消す */
      color: var(--tx);
      transition: background-color .12s, box-shadow .12s;
      cursor: pointer;
      user-select: none;
      min-width: 0;
    }

    .nav-num {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: var(--tx3);
      margin-bottom: 2px;
    }

    .nav-label {
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-align: left;
    }

    .nav-item:hover {
      background-color: var(--bg3);
    }

    .nav-item.active {
      background-color: var(--bg);
      box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 0 0 1px var(--line);
    }

    @media (max-width: 1000px) {
      .nav-container { grid-template-columns: repeat(4, 1fr); }
    }
    @media (max-width: 500px) {
      .nav-container { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>

  <!-- 📌 【修正点】Notionの親ウィンドウを直接ジャンプさせるため、target="_parent" を指定した正規URLリンク構造に変更 -->
  <div class="nav-container">
    <a href="https://notion.com" target="_parent" class="nav-item active" onclick="setActive(this)">
      <div class="nav-num">01</div><div class="nav-label">タスク</div>
    </a>
    <a href="https://notion.com" target="_parent" class="nav-item" onclick="setActive(this)">
      <div class="nav-num">02</div><div class="nav-label">プロジェクト</div>
    </a>
    <a href="https://notion.com" target="_parent" class="nav-item" onclick="setActive(this)">
      <div class="nav-num">03</div><div class="nav-label">カレンダー</div>
    </a>
    <a href="https://notion.com" target="_parent" class="nav-item" onclick="setActive(this)">
      <div class="nav-num">04</div><div class="nav-label">目標</div>
    </a>
    <a href="https://notion.com" target="_parent" class="nav-item" onclick="setActive(this)">
      <div class="nav-num">05</div><div class="nav-label">Brain Stash</div>
    </a>
    <a href="https://notion.com" target="_parent" class="nav-item" onclick="setActive(this)">
      <div class="nav-num">06</div><div class="nav-label">WishList</div>
    </a>
    <a href="https://notion.com" target="_parent" class="nav-item" onclick="setActive(this)">
      <div class="nav-num">07</div><div class="nav-label">リスク</div>
    </a>
    <a href="https://notion.com" target="_parent" class="nav-item" onclick="setActive(this)">
      <div class="nav-num">08</div><div class="nav-label">日数</div>
    </a>
  </div>

  <script>
    function setActive(element) {
      document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
      element.classList.add('active');
    }
  </script>
</body>
</html>
